spring.application.name=demoSpringDataJPAVoiThymeleaf
# Cấu hình kết nối Database
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db
spring.datasource.username=root
spring.datasource.password=sapassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA / Hibernate
# ddl-auto=none: Hibernate không tự tạo hoặc sửa bảng trong database.
spring.jpa.hibernate.ddl-auto=none

# Hiển thị câu SQL mà Hibernate thực thi trong console.
spring.jpa.show-sql=true

# THÊM 2 DÒNG DƯỚI ĐÂY ĐỂ SỬA LỖI:
# 1. Chỉ định rõ phương ngữ (Dialect) để Hibernate không cần tự dò tìm (gây ra lỗi)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 2. (Tùy chọn) Định dạng lại câu SQL cho dễ đọc khi in ra console
spring.jpa.properties.hibernate.format_sql=true