<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>

    <style>

        th, td {
            border: solid black 1px;
            padding: 12px;
            text-align: left;
        }
    </style>
</head>
<body>

    <form th:action="@{/employees/search}" method="get">
        <input type="text" name="id" placeholder="Nhap id nv de tim">
        <button type="submit">Tìm</button>
    </form>

    <a th:href="@{/employees}">Xem tất cả</a>

    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Role</th>
            <th>Salary</th>
            <th>Dep_id</th>
            <th>Pos_id</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="nv: ${dsnv}">
            <td th:text="${nv.id}"></td>
            <td th:text="${nv.getName()}"></td>
            <td th:text="${nv.role}"></td>
            <td th:text="${nv.salary}"></td>
            <td th:text="${nv.departmentId}"></td>
            <td th:text="${nv.positionId}"></td>
        </tr>
        </tbody>
    </table>

</body>
</html>
