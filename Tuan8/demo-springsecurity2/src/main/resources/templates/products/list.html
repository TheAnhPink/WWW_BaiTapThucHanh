<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/products">
                <i class="fas fa-box"></i> Product Management
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">
                    Welcome, <span th:text="${#authentication.name}">User</span>
                </span>
                <a class="btn btn-outline-light" th:href="@{/logout}">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Debug info -->
        <div class="alert alert-info">
            <strong>Debug:</strong> Products count: <span th:text="${products != null ? products.size() : 'null'}">0</span>
        </div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-box"></i> Product List</h2>
            <div sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/products/add}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add New Product
                </a>
            </div>
        </div>

        <div class="row" th:if="${products == null || products.size() == 0}">
            <div class="col-md-6 col-lg-4 mb-4" th:each="product : ${products}">
                <div class="card h-100">
                    <img th:src="${product.imageUrl != null ? product.imageUrl : '/images/no-image.png'}" 
                         class="card-img-top" style="height: 200px; object-fit: cover;" 
                         alt="Product Image">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                        <p class="card-text" th:text="${product.description}">Product Description</p>
                        <div class="mt-auto">
                            <p class="card-text">
                                <strong>Price: $</strong><span th:text="${product.price}">0.00</span>
                            </p>
                            <p class="card-text">
                                <strong>Quantity: </strong><span th:text="${product.quantity}">0</span>
                            </p>
                            <div class="btn-group w-100" role="group">
                                <a th:href="@{/products/view/{id}(id=${product.id})}" 
                                   class="btn btn-outline-primary btn-sm">
                                    <i class="fas fa-eye"></i> View
                                </a>
                                <div sec:authorize="hasRole('ADMIN')">
                                    <a th:href="@{/products/edit/{id}(id=${product.id})}" 
                                       class="btn btn-outline-warning btn-sm">
                                        <i class="fas fa-edit"></i> Edit
                                    </a>
                                    <a th:href="@{/products/delete/{id}(id=${product.id})}" 
                                       class="btn btn-outline-danger btn-sm"
                                       onclick="return confirm('Are you sure you want to delete this product?')">
                                        <i class="fas fa-trash"></i> Delete
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${products == null || products.size() == 0}" class="text-center">
            <div class="alert alert-info">
                <i class="fas fa-info-circle"></i> No products found.
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
