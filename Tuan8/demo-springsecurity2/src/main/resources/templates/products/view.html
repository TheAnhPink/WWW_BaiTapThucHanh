<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/products">
                <i class="fas fa-box"></i> Product Management
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">
                    Welcome, <span th:text="${#authentication.name}">User</span>
                </span>
                <a class="btn btn-outline-light" href="/logout">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3><i class="fas fa-eye"></i> Product Details</h3>
                        <div sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-warning btn-sm">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <img th:src="${product.imageUrl != null ? product.imageUrl : '/images/no-image.png'}" 
                                     class="img-fluid rounded" 
                                     style="max-height: 400px; object-fit: cover;"
                                     alt="Product Image">
                            </div>
                            <div class="col-md-6">
                                <h4 th:text="${product.name}">Product Name</h4>
                                <p class="text-muted" th:text="${product.description}">Product Description</p>
                                
                                <div class="row mb-3">
                                    <div class="col-6">
                                        <strong>Price:</strong>
                                        <span class="h5 text-success">$<span th:text="${product.price}">0.00</span></span>
                                    </div>
                                    <div class="col-6">
                                        <strong>Quantity:</strong>
                                        <span class="h5 text-info" th:text="${product.quantity}">0</span>
                                    </div>
                                </div>
                                
                                <div class="d-flex justify-content-between mt-4">
                                    <a href="/products" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left"></i> Back to Products
                                    </a>
                                    <div sec:authorize="hasRole('ADMIN')">
                                        <a th:href="@{/products/delete/{id}(id=${product.id})}" 
                                           class="btn btn-danger"
                                           onclick="return confirm('Are you sure you want to delete this product?')">
                                            <i class="fas fa-trash"></i> Delete
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
